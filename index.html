<!doctype html>
<html lang="sk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio</title>
    <meta
      name="description"
      content="Jednoduche osobne portfolio programatora alebo digitalneho tvorcu."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a class="brand" href="#top" aria-label="Domov">
          <img src="assets/logo1.svg" alt="logo" />
        </a>

        <div class="menu">
          <button
            class="button button-outline menu-toggle"
            type="button"
            aria-controls="site-menu"
            aria-expanded="false"
            aria-label="Otvorit menu"
          >
            <span class="menu-toggle-label">Menu</span>
            <img
              class="menu-toggle-nut"
              src="assets/nut.svg"
              alt=""
              width="28"
              height="28"
              aria-hidden="true"
            />
          </button>

          <nav id="site-menu" class="site-nav" aria-label="Hlavna navigacia">
            <a href="#about">O mne</a>
            <a href="#projects">Projekty</a>
            <a href="#contact">Kontakt</a>
          </nav>
        </div>
      </div>
    </header>

    <main id="top">
      <section id="about" class="section" aria-label="O mne">
        <div class="section-heading">
          <h2 class="eyebrow">O mne</h2>
        </div>
        <div class="about-copy" data-about></div>
      </section>

      <section id="projects" class="section" aria-label="Projekty">
        <div class="section-heading">
          <h2 class="eyebrow">Projekty</h2>
        </div>

        <div class="project-grid" data-projects></div>
      </section>

      <section id="contact" class="section contact" aria-label="Kontakt">
        <div class="section-heading">
          <h2 class="eyebrow">Kontakt</h2>
        </div>

        <form class="contact-form" action="#" method="post">
          <label>
            Meno
            <input type="text" name="name" autocomplete="name" required />
          </label>
          <label>
            Email
            <input type="email" name="email" autocomplete="email" required />
          </label>
          <label>
            Sprava
            <textarea name="message" rows="5" required></textarea>
          </label>
          <button class="button button-primary" type="submit">
            Odoslat
            <span class="button-arrow" aria-hidden="true"></span>
          </button>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <nav class="footer-nav" aria-label="Navigacia v pate">
        <a href="#about">O mne</a>
        <a href="#projects">Projekty</a>
        <a href="#contact">Kontakt</a>
      </nav>
      <p>&copy; 2026</p>
    </footer>
    <script src="app.js" defer></script>
  </body>
</html>
