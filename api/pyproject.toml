[project]
name = "portfolio-api"
version = "0.1.0"
description = "Small contact API for the portfolio site."
requires-python = ">=3.11"
dependencies = [
  "aiosmtplib>=3.0.2",
  "fastapi>=0.115.0",
  "pydantic[email]>=2.9.0",
  "python-dotenv>=1.0.1",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["app"]
